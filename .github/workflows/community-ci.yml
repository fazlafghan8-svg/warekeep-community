name: Community CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify:dependency-notices
      - run: npm run test:source-export
      - run: npm run test:unit
      - run: npx playwright install chromium
      - run: npm run test:e2e:community
      - run: npm run build
      - run: npm run verify:artifacts -- dist
